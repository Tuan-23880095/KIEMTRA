# Đồng bộ KIEMTRA vào thư mục kiemtra/ của repo diemdanhsv.
# Hostinger đang auto-deploy repo diemdanhsv vào diemdanhsv.com, nên sau mỗi lần
# đẩy code lên KIEMTRA, trang https://diemdanhsv.com/kiemtra/ tự cập nhật.
#
# Cần MỘT secret trong repo KIEMTRA: Settings → Secrets and variables → Actions →
#   DIEMDANHSV_TOKEN = fine-grained token, chỉ repo diemdanhsv, quyền Contents: Read and write.
name: Dong bo sang diemdanhsv/kiemtra

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dong-bo-diemdanhsv
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã KIEMTRA
        uses: actions/checkout@v4
        with:
          path: kiemtra-src

      - name: Lấy repo diemdanhsv
        uses: actions/checkout@v4
        with:
          repository: Tuan-23880095/diemdanhsv
          token: ${{ secrets.DIEMDANHSV_TOKEN }}
          path: site

      - name: Chép vào site/kiemtra
        run: |
          mkdir -p site/kiemtra
          rsync -a --delete --exclude '.git' --exclude '.github' --exclude '.gitignore' kiemtra-src/ site/kiemtra/

      - name: Commit và đẩy nếu có thay đổi
        working-directory: site
        run: |
          git config user.name "kiemtra-sync[bot]"
          git config user.email "kiemtra-sync@users.noreply.github.com"
          git add kiemtra
          if git diff --cached --quiet; then
            echo "Không có thay đổi."
            exit 0
          fi
          git commit -m "Đồng bộ KIEMTRA ${GITHUB_SHA::7} vào /kiemtra"
          git push
